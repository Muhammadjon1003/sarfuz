<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Circular background -->
  <circle cx="90" cy="90" r="88" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Inner circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="90" cy="90" r="72" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Brain icon (AI symbol) -->
  <g transform="translate(90, 90)">
    <!-- Left hemisphere -->
    <path d="M -15 -20 Q -25 -15 -28 0 Q -25 15 -15 20 Q -8 10 -8 0 Q -8 -10 -15 -20" 
          fill="#ffffff" opacity="0.95"/>
    
    <!-- Right hemisphere -->
    <path d="M 15 -20 Q 25 -15 28 0 Q 25 15 15 20 Q 8 10 8 0 Q 8 -10 15 -20" 
          fill="#ffffff" opacity="0.95"/>
    
    <!-- Central nodes -->
    <circle cx="-10" cy="-8" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="0" cy="-12" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="10" cy="-8" r="2.5" fill="#fbbf24" opacity="0.9"/>
    
    <circle cx="-12" cy="0" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="0" cy="4" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="12" cy="0" r="2.5" fill="#fbbf24" opacity="0.9"/>
    
    <circle cx="-8" cy="10" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="8" cy="10" r="2.5" fill="#fbbf24" opacity="0.9"/>
    
    <!-- Connecting lines -->
    <line x1="-10" y1="-8" x2="0" y2="-12" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="0" y1="-12" x2="10" y2="-8" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="-10" y1="-8" x2="-12" y2="0" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="10" y1="-8" x2="12" y2="0" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="-12" y1="0" x2="0" y2="4" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="0" y1="4" x2="12" y2="0" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="-8" y1="10" x2="0" y2="4" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
    <line x1="8" y1="10" x2="0" y2="4" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
